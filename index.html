<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0d" />
  <meta name="description" content="High Line Racing Network league app" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HLRN" />
  <link rel="stylesheet" href="style.css?v=12.0.1" />
  <title>HLRN</title>
</head>
<body><div class="ambient-checkers" aria-hidden="true"></div>
  <div class="app-shell">
    <header class="topbar"><div class="topbar-glow" aria-hidden="true"></div>
      <div class="top-brand"><img src="hlrn-logo-4k.png" alt="HLRN"><div><div class="eyebrow">HIGH LINE RACING NETWORK</div><h1>HLRN</h1></div></div>
      <div class="top-actions"><div class="top-network-pill"><span class="top-live-dot" aria-hidden="true"></span><b>NETWORK READY</b></div><button class="icon-btn notification-quick" id="notificationQuickBtn" onclick="openFeature('notifications')" aria-label="Open notifications">🔔<i id="notificationQuickBadge" hidden></i></button><button class="icon-btn sound-toggle" id="soundToggleBtn" onclick="toggleHLRNSound()" aria-label="Turn sound effects off">🔊</button><button class="icon-btn" id="installBtn" hidden aria-label="Install app">＋</button></div>
    </header>

    <div id="pullRefreshIndicator" class="pull-refresh-indicator"><b>↻</b><span>Pull to refresh</span></div>
    <main id="app"></main>

    <nav class="bottom-nav" aria-label="Primary"><div class="nav-glow" aria-hidden="true"></div>
      <button type="button" class="nav-item active" data-view="home" onclick="hlrnNav('home')"><span class="nav-icon">⌂</span><small>Home</small></button>
      <button type="button" class="nav-item" data-view="standings" onclick="hlrnNav('standings')"><span class="nav-icon">🏆</span><small>Standings</small></button>
      <button type="button" class="nav-item" data-view="schedule" onclick="hlrnNav('schedule')"><span class="nav-icon">🏁</span><small>Schedule</small></button>
      <button type="button" class="nav-item" data-view="drivers" onclick="hlrnNav('drivers')"><span class="nav-icon">👤</span><small>Drivers</small></button>
      <button type="button" class="nav-item" data-view="socials" onclick="hlrnNav('socials')"><span class="nav-icon">🔗</span><small>Socials</small></button>
    </nav>
  </div>

  <script src="rules-data.js?v=12.0.1"></script>
<script src="standings-driver-photos.js?v=12.0.1"></script>
<script src="app.js?v=12.0.1"></script>
</body>
</html>
