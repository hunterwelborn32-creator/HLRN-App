<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0d" />
  <meta name="description" content="High Line Racing Network league app" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HLRN" />
  <link rel="stylesheet" href="style.css?v=8.4" />
  <title>HLRN</title>
</head>
<body><div class="ambient-checkers" aria-hidden="true"></div>
  <div class="app-shell">
    <header class="topbar">
      <div class="top-brand"><img src="hlrn-logo-4k.png" alt="HLRN"><div><div class="eyebrow">HIGH LINE RACING NETWORK</div><h1>HLRN</h1></div></div>
      <div class="top-actions"><span class="top-live-dot" aria-hidden="true"></span><button class="icon-btn" id="installBtn" hidden aria-label="Install app">＋</button></div>
    </header>

    <main id="app"></main>

    <nav class="bottom-nav" aria-label="Primary">
      <button class="nav-item active" data-view="home"><span class="nav-icon">⌂</span><small>Home</small></button>
      <button class="nav-item" data-view="standings"><span class="nav-icon">🏆</span><small>Standings</small></button>
      <button class="nav-item" data-view="schedule"><span class="nav-icon">🏁</span><small>Schedule</small></button>
      <button class="nav-item" data-view="drivers"><span class="nav-icon">👤</span><small>Drivers</small></button>
      <button class="nav-item" data-view="socials"><span class="nav-icon">🔗</span><small>Socials</small></button>
    </nav>
  </div>

  <script src="rules-data.js?v=8.4"></script>
<script src="app.js?v=8.4"></script>
</body>
</html>
